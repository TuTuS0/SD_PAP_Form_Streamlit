<div class="score-share">
  <button class="share-button" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
      <path d="M12 16V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span></span>
  </button>
  <div class="messaging-options">
    <a class="messages-link"></a>
    <a class="whatsapp-link" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  </div>
  <button class="copy-button" type="button"></button>
  <p class="share-status" role="status" aria-live="polite"></p>
  <dialog class="share-dialog">
    <p class="preview-label"></p>
    <textarea class="share-preview" readonly rows="6" spellcheck="false"></textarea>
    <p class="manual-hint"></p>
    <button class="close-button" type="button"></button>
  </dialog>
</div>
